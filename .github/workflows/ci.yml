name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Keep in step with `loup` in package.lppkg.
      LOUP_VERSION: "1.26.0"
    steps:
      - uses: actions/checkout@v4

      - name: Install lld and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y lld qemu-system-x86 qemu-system-arm

      - name: Install Loup ${{ env.LOUP_VERSION }}
        run: |
          curl -fsSL "https://github.com/code-craft-ai-company/loup-releases/releases/download/v${LOUP_VERSION}/loup-install.sh" \
            | sh -s -- --version "${LOUP_VERSION}" --no-modify-path -y
          echo "$HOME/.loup/bin" >> "$GITHUB_PATH"

      - name: Show toolchain
        run: |
          loup --version
          clang --version | head -n 1
          ld.lld --version
          qemu-system-x86_64 --version | head -n 1
          qemu-system-aarch64 --version | head -n 1

      - name: Check, build and boot
        run: make ci

      - name: Upload images
        uses: actions/upload-artifact@v4
        with:
          name: sched-images
          path: build/*.elf
          if-no-files-found: error
